# Set your personal hyprland configuration here
# See https://wiki.hypr.land/Configuring for more information

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hypr.land/Configuring/Variables/#input
input {
    # kb_layout = us
    # follow_mouse = 1
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat
    # numlock_by_default = true

    # 🔗 See https://wiki.hypr.land/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = no
    }

}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
    vrr = 1
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}

# Match fade duration to windowsOut so the window frame doesn't linger after content fades
animations {
    animation = fade, 1, 4, default
    animation = windows, 1, 3, wind, slide
    animation = windowsIn, 1, 3, winIn, slide
    animation = windowsOut, 1, 3, winOut, slide
    animation = windowsMove, 1, 3, wind, slide
    animation = workspaces, 1, 3, wind
}



# hyprtasking — exposé-style overview
plugin {
    hyprtasking {
        layout = linear
        linear:height = 400
        linear:top = false
        linear:blur = false
        bg_color = rgb(1e1e2e)
        border_size = 2
        gap_size = 8
        exit_on_click = true
    }
}
bind = SUPER, TAB, hyprtasking:toggle, cursor

# satty (screenshot annotation) — tile instead of float
windowrule = float false, match:class ^(com.gabm.satty)$
