# HyDE-layout wrapper for omarchy
# Defines vars HyDE.conf expects, then sources the layout.

# Background (tracks omarchy theme)
$BACKGROUND_PATH = ~/.config/omarchy/current/background

# Avatar (center image). Default = current background; override in
# hyprlock-local.conf to use a personal image. See hyprlock-local.conf.example.
$MPRIS_IMAGE = ~/.config/omarchy/current/background

# MPRIS / splash / battery placeholders (HyDE provides these via its env)
$SPLASH_CMD   = echo ""
$BATTERY_ICON = echo ""

# Color vars — mapped from omarchy current theme (tokyo-night palette)
$text                = rgba(192,202,245, 1.0)
$wallbash_txt1_rgba  = rgba(192,202,245, 1.0)
$wallbash_txt2_rgba  = rgba(169,177,214, 0.85)
$wallbash_pry2_rgba  = rgba(26,27,38, 0.8)
$wallbash_pry4_rgba  = rgba(122,162,247, 1.0)
$wallbash_3xa9_rgba  = rgba(192,202,245, 1.0)
$wallbash_4xa9_rgba  = rgba(122,162,247, 1.0)

general {
    ignore_empty_input = true
}

auth {
    fingerprint:enabled = false
}

# Per-machine overrides (e.g. personal avatar). Optional — error if missing
# is non-fatal; defaults above will be used. See hyprlock-local.conf.example.
source = ~/.config/hypr/hyprlock-local.conf

source = ~/.config/hypr/hyprlock/HyDE.conf
