# Change the default Omarchy look'n'feel

# NVIDIA fixes for backdrop-filter artifacts
debug {
    damage_tracking = 0      # Full redraws instead of partial
}

render {
    direct_scanout = false   # Disable direct scanout (causes issues with blur)
}

cursor {
    no_hardware_cursors = true  # Software cursors avoid DRM conflicts
}

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Gradient border: ice blue to purple (matching reference)
    col.active_border = rgb(89dceb) rgb(b4befe) rgb(cba6f7) 45deg

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 18
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}
